# Set up the plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'soyuka/tmux-current-pane-hostname'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# Other plug-in examples:
# Install with `ctrl_d I`
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Worth a look -- uncomment and hit `ctrl_d I` to try:
#
# tmux-yank: copy-mode selections go to the system clipboard (pbcopy on
# macOS, xclip/wl-copy on Linux). Right now `y` in copy mode only fills
# tmux's own buffer, so nothing leaves the terminal.
# set -g @plugin 'tmux-plugins/tmux-yank'
#
# extrakto: `ctrl_d tab` fuzzy-finds any word, path, URL, or git SHA that's
# on screen and inserts or copies it. Same fzf muscle memory as vf/vrg/zd,
# applied to whatever already scrolled past.
# set -g @plugin 'laktak/extrakto'
#
# tmux-open: in copy mode, `o` opens the highlighted path or URL, `ctrl-o`
# opens it in $EDITOR.
# set -g @plugin 'tmux-plugins/tmux-open'
#
# tmux-sensible is commented out below -- most of what it sets (escape-time,
# focus-events, history-limit) is now set explicitly further down, so it
# would mostly be redundant.

# Continuum for autosaving
# Restore at boot and save ever 15 minutes
# set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# autosave on detach
bind-key d run-shell "#{@resurrect-save-script-path} quiet" \; detach-client

# Navigate splits in vim and tmux the same way
# Basics: Use Ctrl+h to move left, Ctrl+j down, etc
# More: https://github.com/christoomey/vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# Non-plugin settings
# Set the colors correctly
#
# tmux-256color is the correct entry to advertise inside tmux (it describes
# what tmux itself can do, including italics -- which .vimrc turns on via
# oceanic_italic_comments). macOS ships an ancient ncurses that often has no
# tmux-256color entry, so fall back to xterm-256color when it's missing.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "xterm-256color"'

# terminal-features is the modern replacement for terminal-overrides (tmux
# 3.2+). RGB gets you truecolor regardless of which entry won above.
set -as terminal-features ",*256col*:RGB"
# keep the old override too, for tmux < 3.2
set -ga terminal-overrides ",*256col*:Tc"

# Don't swallow the escape key. The default is 500ms, which makes hitting
# Esc in vim feel broken. This is the single most useful line in this file.
set -sg escape-time 0

# Let vim know when the terminal gains/loses focus, so :checktime and
# gitgutter refresh when you tab back in
set -g focus-events on

# The default 2000 lines of scrollback is not much
set -g history-limit 50000

# After closing a window, renumber the rest so there aren't gaps
set -g renumber-windows on

# Keep the status bar up to date. Quickly!
set -g status-interval 1

# More sane(?) keybindings?
# Use ctrl-d instead of b
# Heads up: this shadows the shell's EOF. To actually send ctrl-d (to exit a
# shell, quit a REPL, etc.) press it twice -- the binding below passes the
# second one through.
unbind C-b
set -g prefix C-d
bind C-d send-prefix

# split panes using \ and -
# start new panes from the path you were in
# not the path the session was created in
bind '\' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
unbind '"'
unbind '%'

# Start windows at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Use vim-style navigation to move around in copy mode
# First, enter copy mode with ctrl+d [
# Then move up and down with j, k
# or ctrl+b, ctrl+f
# search with / or ?
# q to quit copy mode
setw -g mode-keys vi

# start new windows with the path they were created from
bind c new-window -c '#{pane_current_path}'

# use a fancy window/pane picker
unbind s
bind s choose-tree

# use a mouse!
set -g mouse on

# reload the config with R (that's a capital `R`)
bind R source-file ~/.tmux.conf \; display-message 'Config reloaded...'

# set the status bar -- hostname and session name on the left
set -g status-left-length 150
set -g status-right ''
set -g status-left '#H #S'
# don't show the window status
set -g window-status-current-format ''
set -g window-status-format ''

# Initialize TMUX plugin manager
# keep this line at the very bottom of this file
run -b '~/.tmux/plugins/tpm/tpm'
